group = 'dev.nativelocation.tracker'
version = '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.2.1"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'dev.nativelocation.tracker'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdk 23
    }

    testOptions {
        // The uploader logs through android.util.Log, which is a stub that
        // throws in JVM unit tests. The tests here are about the JSON the
        // uploader builds, so the logging is allowed to no-op rather than
        // being worth a Robolectric runtime.
        unitTests.returnDefaultValues = true
    }
}

// Flutter 3.44+ provides Kotlin through AGP's built-in Kotlin support.
// Plugins must not apply the Kotlin Gradle Plugin themselves.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-location:21.1.0'
    implementation 'androidx.core:core-ktx:1.12.0'

    // Android stubs org.json in JVM unit tests — every call throws "not
    // mocked" — so the real implementation is supplied for the tests that
    // assert on the JSON the uploader builds.
    testImplementation 'org.json:json:20231013'
    testImplementation 'junit:junit:4.13.2'
}
